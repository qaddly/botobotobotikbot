<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload to GitHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #8B0000, #c0392b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(139, 0, 0, 0.4);
        }
        .icon svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 35px;
            line-height: 1.5;
        }
        .upload-btn {
            width: 100%;
            padding: 16px 30px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #8B0000, #a00000);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.3);
            letter-spacing: 0.3px;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.4);
        }
        .upload-btn:active {
            transform: translateY(0);
        }
        .upload-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #status {
            margin-top: 25px;
            font-size: 14px;
            line-height: 1.6;
            min-height: 20px;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success {
            color: #2ecc71;
            animation: fadeIn 0.5s ease;
        }
        .error {
            color: #e74c3c;
            animation: fadeIn 0.5s ease;
        }
        .loading {
            color: rgba(255, 255, 255, 0.7);
        }
        .repo-link {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }
        .repo-link a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .repo-link a:hover {
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .version {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Upload to GitHub</h1>
        <p class="subtitle">Загрузка index.html на GitHub Pages<br>для botobotobotikbot</p>
        <button class="upload-btn" id="uploadBtn" onclick="upload()">
            Загрузить
        </button>
        <div id="status"></div>
        <div class="repo-link">
            <a href="https://github.com/qaddly/botobotobotikbot" target="_blank">github.com/qaddly/botobotobotikbot</a>
        </div>
        <div class="version" id="version"></div>
    </div>

    <script>
        const REPO = 'qaddly/botobotobotikbot';
        const TOKEN = atob('Z2hwX2g3Zkh1S3VOaFJwd2JIWUNFVG5HSU45UDVTbDExOTB6MTlJYQ==');

        async function upload() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.className = 'loading';
            status.innerHTML = '<span class="spinner"></span>Загрузка файла...';

            try {
                const resp = await fetch('index.html');
                if (!resp.ok) throw new Error('Файл index.html не найден');
                const text = await resp.text();
                const b64 = btoa(unescape(encodeURIComponent(text)));

                const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/index.html', {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update index.html',
                        content: b64
                    })
                });

                if (r.ok) {
                    const data = await r.json();
                    const sha = data.commit.sha.substring(0, 7);
                    const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    status.className = 'success';
                    status.innerHTML = '&#10004; Загружено! Commit: <strong>' + sha + '</strong><br><span style="font-size:12px;opacity:0.7;">' + time + '</span>';
                    document.getElementById('version').textContent = 'v' + sha;
                } else {
                    const err = await r.text();
                    status.className = 'error';
                    status.textContent = 'Ошибка: ' + err;
                }
            } catch (e) {
                status.className = 'error';
                status.textContent = 'Ошибка: ' + e.message;
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
