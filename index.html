<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botobotobotikbot</title>
    <style>
        * { margin: 0; padding: 0; }
        
        body {
            background: #ffffff;
            overflow: hidden;
        }

        .header {
            width: 100%;
            height: 50px;
            background: #8B0000;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .header.visible {
            opacity: 1;
        }

        .header-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            margin-left: 20px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            margin-left: auto;
            margin-right: 20px;
        }

        .header-icon:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .header-icon:active {
            transform: scale(0.95);
        }

        .header-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .overlay-text {
            font-size: clamp(16px, 4vw, 28px);
            font-weight: 700;
            color: #8B0000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            text-align: center;
            padding: 0 30px;
            line-height: 1.5;
            max-width: 800px;
        }

        .back-btn {
            position: absolute;
            bottom: 40px;
            padding: 15px 50px;
            background: #8B0000;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.3);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .header-icon {
                width: 28px;
                height: 28px;
                margin-right: 12px;
            }
            .header-icon svg {
                width: 15px;
                height: 15px;
            }
            .header-text {
                font-size: 14px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="header" id="header">
        <span class="header-text">barberzhon</span>
        <div class="header-icon" id="iconBtn" onclick="showOverlay()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-text">Этот сайт создан для того, чтобы мой автоответчик реагировал на ваши запросы и отвечал вам как бот в Telegram. Почему он не в Telegram? Так как я нахожусь в стране, где действует блокировка Telegram, которая мешает боту нормально функционировать.</div>
        <button class="back-btn" onclick="hideOverlay()">Назад</button>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('header').classList.add('visible');
            setTimeout(() => {
                document.getElementById('loader').remove();
            }, 500);
        }, 3000);

        function showOverlay() {
            document.getElementById('overlay').classList.add('active');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>
</html>
