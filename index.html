<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botobotobotikbot</title>
    <style>
        * { margin: 0; padding: 0; }
        
        body {
            background: #ffffff;
            overflow: hidden;
        }

        .header {
            width: 100%;
            height: 50px;
            background: #8B0000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .header.visible {
            opacity: 1;
        }

        .header-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .header-icon {
            width: 30px;
            height: 30px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            margin-right: 5px;
        }

        .header-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .header-icon:active {
            transform: scale(0.95);
        }

        .header-icon span {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .header {
                padding: 0 8px;
            }
            .header-icon {
                width: 26px;
                height: 26px;
                margin-right: 2px;
            }
            .header-icon span {
                font-size: 15px;
            }
            .header-text {
                font-size: 14px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="header" id="header">
        <span class="header-text">barberzhon</span>
        <div class="header-icon" id="iconBtn" onclick="handleIconClick()">
            <span>¡</span>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('header').classList.add('visible');
            setTimeout(() => {
                document.getElementById('loader').remove();
            }, 500);
        }, 3000);

        function handleIconClick() {
            alert('Нажато!');
        }
    </script>
</body>
</html>
